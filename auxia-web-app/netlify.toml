# auxia-netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# React Router: cualquier ruta (/profile, /gis-map...) devuelve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Archivos con hash de Vite: cache largo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
